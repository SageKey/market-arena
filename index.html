<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bulls vs Bears — live tape</title>
<style>
  :root {
    --a: #22e5a0;
    --b: #ff4d6a;
    --ink: #e8ecf1;
    --dim: #7c8798;
    --bg: #06080b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* battlefield only — scoped so the chart canvas is not swallowed by it */
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .layer { position: fixed; inset: 0; pointer-events: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: baseline; gap: 14px; padding: 18px 22px;
  }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .status { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .dot.live { background: var(--a); box-shadow: 0 0 8px var(--a); }
  .dot.dead { background: var(--b); }

  .meter-wrap { position: fixed; top: 54px; left: 22px; right: 22px; }
  .meter { height: 3px; border-radius: 2px; background: var(--b); overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--a); width: 50%; transition: width .4s cubic-bezier(.4,0,.2,1); }
  .meter-labels { display: flex; justify-content: space-between; margin-top: 7px; font-size: 12px; font-weight: 500; }
  .a-t { color: var(--a); } .b-t { color: var(--b); }
  .num { font-variant-numeric: tabular-nums; }

  .board {
    position: fixed; left: 22px; bottom: 20px; font-size: 12px; color: var(--dim);
    display: grid; grid-template-columns: auto auto; gap: 3px 16px;
    background: rgba(6,8,11,.72); padding: 10px 14px; border-radius: 8px;
    backdrop-filter: blur(6px);
  }
  .board b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .dimspan { opacity: .5; }

  .feed {
    position: fixed; right: 22px; bottom: 20px; width: 232px;
    display: flex; flex-direction: column-reverse; gap: 3px;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .kill {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 5px 9px; border-radius: 5px;
    background: rgba(6,8,11,.8); border-left: 2px solid var(--dim);
    backdrop-filter: blur(6px);
    animation: slide .28s cubic-bezier(.2,0,0,1);
  }
  .kill.a { border-left-color: var(--a); }
  .kill.b { border-left-color: var(--b); }
  .kill .coin { color: var(--ink); font-weight: 500; }
  .kill .amt { color: var(--dim); white-space: nowrap; }
  .kill.big { background: rgba(20,24,30,.92); }
  .kill.big .amt { color: var(--ink); }
  @keyframes slide { from { opacity: 0; transform: translateX(14px); } }

  .price {
    position: fixed; left: 50%; transform: translateX(-50%); top: 86px;
    background: rgba(6,8,11,.8); border-radius: 9px; padding: 9px 16px 7px;
    backdrop-filter: blur(6px); text-align: center; width: 292px;
  }
  .prow { display: flex; align-items: baseline; justify-content: center; gap: 7px; }
  .plabel { font-size: 10px; color: var(--dim); letter-spacing: .1em; }
  .pnow { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pchg { font-size: 11px; font-variant-numeric: tabular-nums; }
  #spark { display: block; width: 260px; height: 44px; margin: 5px auto 0; }
  .legend { display: flex; gap: 13px; justify-content: center; margin-top: 3px; font-size: 9px; color: var(--dim); }
  .legend i { display: inline-block; width: 8px; height: 2px; margin-right: 4px; vertical-align: middle; }
  .sw-px { background: #e8ecf1; }
  .sw-cvd { background: #8b7cf6; }

  .hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); color: var(--dim); font-size: 13px; }

  /* A shared link gets opened on a phone more often than not. Narrow screens
     get a smaller army, tighter chrome, and no kill feed — the battle and the
     chart are what matter; the feed is the first thing that can go. */
  @media (max-width: 720px) {
    header { padding: 12px 14px; gap: 8px; flex-wrap: nowrap; }
    h1 { font-size: 13px; white-space: nowrap; }
    .status { font-size: 10px; white-space: nowrap; }
    .meter-wrap { top: 44px; left: 14px; right: 14px; }
    .meter-labels { font-size: 10px; }
    .price { top: 72px; width: calc(100% - 28px); max-width: 320px; padding: 7px 10px 5px; }
    .pnow { font-size: 15px; }
    #spark { width: 100%; height: 40px; }
    .board { left: 14px; right: 14px; bottom: 14px; font-size: 11px; padding: 8px 11px; }
    .feed { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="layer">
  <header>
    <h1 id="title">Bulls vs Bears</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="stat">connecting…</span></span>
  </header>

  <div class="meter-wrap">
    <div class="meter"><i id="bar"></i></div>
    <div class="meter-labels">
      <span class="a-t"><span id="aName">BULLS</span> <span class="num" id="aArmy">10,000</span></span>
      <span class="b-t"><span class="num" id="bArmy">10,000</span> <span id="bName">BEARS</span></span>
    </div>
  </div>

  <div class="board">
    <span>trades</span><b id="nTrades">0</b>
    <span>volume</span><b id="vol">$0</b>
    <span>market <span class="dimspan">3m</span></span><b id="drift">—</b>
    <span>buy pressure</span><b id="aKills">$0</b>
    <span>sell pressure</span><b id="bKills">$0</b>
    <span>biggest hit</span><b id="biggest">—</b>
  </div>

  <div class="price">
    <div class="prow">
      <span class="plabel">BTC · 24H</span>
      <span class="pnow" id="btcPx">—</span>
      <span class="pchg" id="btcChg"></span>
    </div>
    <canvas id="spark" width="520" height="88"></canvas>
    <div class="legend">
      <span><i class="sw-px"></i>price · 24h</span>
      <span><i class="sw-cvd"></i>cumulative volume delta</span>
    </div>
  </div>

  <div class="feed" id="feed"></div>
  <div class="hint" id="hint">waiting for the tape…</div>
</div>

<script>
// ---------------------------------------------------------------------------
// Two pixel armies fight on live exchange data.
//
// Every trade on a public feed names an aggressor — whoever crossed the spread.
// Aggressive buys send faction A's soldiers firing; aggressive sells send
// faction B's. Trade notional decides how many of them pull the trigger.
//
// Two exchanges feed the battle at once (Coinbase spot + Hyperliquid perps),
// roughly 17 trades/sec between them. Browser talks to both directly — no
// server, no API key, no dependencies.
// ---------------------------------------------------------------------------

// --- sprites --------------------------------------------------------------
// 11x18 pixel grids, drawn facing right and mirrored for the other side.
//   .  transparent   1 body   2 outline   3 highlight   4 eye   5 weapon
// Authored and eyeballed as text first (see sprites.py).

const ART = {
  wolf: [
    ".2.......2.", ".22.....22.", ".232...232.", ".2321.2232.",
    ".23111132..", ".2411111 2.", ".23111114 2", "..2311132..",
    "...22122...", "..2311132..", ".231111132.", "231111111 5",
    ".23111132..", ".2311132...", ".231.132...", ".23...32...",
    ".22...22...", "222...222..",
  ],
  vampire: [
    "...22222...", "..2333332..", "..2343432..", "..2333332..",
    "...23332...", "....212....", "..2311132..", ".2231111322",
    "231111111 2", "23111111 55", "231111111 2", ".2311111 2.",
    "..23111 2..", "..231132...", "..231.32...", "..23..32...",
    "..22..22...", ".222..222..",
  ],
  bull: [
    "3.........3", "23.......32", ".23.....32.", "..2333332..",
    "..2341432..", "..2333332..", "...23332...", "....212....",
    "..2311132..", ".231111132.", "23111111 55", ".231111132.",
    "..23111 2..", "..231132...", "..231.32...", "..23..32...",
    "..22..22...", ".222..222..",
  ],
  bear: [
    "..22...22..", ".2332.2332.", ".2332.2332.", "..2333332..",
    "..2341432..", "..2333332..", "...23432...", "....212....",
    "..2311132..", ".231111132.", "23111111 55", ".231111132.",
    "..23111 2..", "..231132...", "..231.32...", "..23..32...",
    "..22..22...", ".222..222..",
  ],
};

const THEMES = {
  market: {
    title: "Bulls vs Bears",
    a: { name: "BULLS", unit: "bulls", rgb: "34,229,160", art: "bull" },
    b: { name: "BEARS", unit: "bears", rgb: "255,77,106", art: "bear" },
  },
  gothic: {
    title: "Werewolves vs Vampires",
    a: { name: "WEREWOLVES", unit: "wolves", rgb: "168,222,88", art: "wolf" },
    b: { name: "VAMPIRES", unit: "vampires", rgb: "226,42,96", art: "vampire" },
  },
  frost: {
    title: "Frost vs Ember",
    a: { name: "FROST", unit: "frost", rgb: "96,196,255", art: "wolf" },
    b: { name: "EMBER", unit: "ember", rgb: "255,142,48", art: "vampire" },
  },
};

const THEME = THEMES[new URLSearchParams(location.search).get("theme")] || THEMES.market;
document.title = THEME.title + " — live tape";
document.documentElement.style.setProperty("--a", "rgb(" + THEME.a.rgb + ")");
document.documentElement.style.setProperty("--b", "rgb(" + THEME.b.rgb + ")");

const PX = 3;                        // pixel scale of the baked sprite
let UNIT = 1;                        // display multiplier, set by layout()
let SW = 11 * PX, SH = 18 * PX;      // sprite size on screen

function shade(rgb, mul, mix) {
  const p = rgb.split(",").map(Number);
  return "rgb(" + p.map(v =>
    Math.max(0, Math.min(255, Math.round(v * mul + (mix || 0))))).join(",") + ")";
}

// Bake each sprite once into its own canvas — per-pixel fillRect across ~90
// sprites every frame would not hold 60fps.
function bake(artName, rgb, flip) {
  const rows = ART[artName];
  const cvs = document.createElement("canvas");
  cvs.width = 11 * PX; cvs.height = 18 * PX;
  const c = cvs.getContext("2d");
  const pal = {
    "1": shade(rgb, 1),
    "2": shade(rgb, 0.34),
    "3": shade(rgb, 1.25, 30),
    "4": "#ffffff",
    "5": "#c9d2dd",
  };
  for (let y = 0; y < rows.length; y++) {
    for (let x = 0; x < rows[y].length; x++) {
      const ch = rows[y][x];
      const col = pal[ch];
      if (!col) continue;
      const px = flip ? (10 - x) : x;
      c.fillStyle = col;
      c.fillRect(px * PX, y * PX, PX, PX);
    }
  }
  return cvs;
}

const SPRITE = {
  0: bake(THEME.a.art, THEME.a.rgb, false),   // side A faces right
  1: bake(THEME.b.art, THEME.b.rgb, true),    // side B faces left
};

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
let W = 0, H = 0;

// --- armies ---------------------------------------------------------------
// The counters are the real army size; the sprites are a company standing in
// for the whole force. They die on every trade and reinforcements march up.

const FORCE = 20000;         // total soldiers on the field, split by momentum
const LOOKBACK = 180000;     // price window driving the war, ms
const SENS = 0.012;          // move that swings the battle decisively (1.2%)
let RANKS = 4, FILES = 7;            // thinned on narrow screens

const S = {
  trades: 0, vol: 0, aArmy: FORCE / 2, bArmy: FORCE / 2,
  biggest: 0, biggestCoin: "", front: 0.5, shake: 0, recent: [],
  px: {},                    // coin -> [{t, p}, ...] trimmed to LOOKBACK
  drift: 0,                  // smoothed aggregate % change

  // BTC gets its own record for the chart. Cumulative volume delta is buy
  // notional minus sell notional, never reset — the running total is the
  // point. A 60-second window only ever shows a snapshot, and trade COUNTS
  // are close to meaningless: retail buys are many and small, institutional
  // sells are few and large, so counting prints tells you nothing about price.
  btc: { px: null, open: null, cvd: 0, series: [], lastSample: 0 },
  buyVol: 0, sellVol: 0,

  // Two timescales doing two jobs. The day's move decides where the front
  // line sits — ground already won. Recent momentum swings the fighting
  // around that position. A hard reset would make the bears forget they had
  // been winning all afternoon, which reads as a glitch rather than a battle.
  day: { series: [], open: null, change: 0, loaded: false },
};

const DAY_SENS = 0.03;     // a 3% day is a decisive rout
const SWING = 0.26;        // how far 3-minute momentum can shove the line

// One public REST call gives ~29h of 5-minute candles, so the chart is useful
// the moment the page loads instead of after ten minutes of collecting.
async function loadDay() {
  try {
    const r = await fetch("https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=300");
    const raw = await r.json();
    if (!Array.isArray(raw)) return;
    const cutoff = Date.now() / 1000 - 86400;
    const rows = raw
      .filter(c => Array.isArray(c) && c[0] >= cutoff)
      .sort((a, b) => a[0] - b[0]);            // API returns newest first
    if (rows.length < 2) return;
    S.day.series = rows.map(c => ({ t: c[0] * 1000, p: c[4] }));
    S.day.open = S.day.series[0].p;
    S.day.loaded = true;
  } catch (e) {
    // offline or blocked — the battle still runs on the live tape alone
  }
}

// Price is the war. Every coin contributes its move over the window; the
// average decides how the field is split. Rising price means bulls are
// genuinely winning ground — no explanation needed for anyone watching.
function recordPrice(coin, p) {
  if (!isFinite(p) || p <= 0) return;
  const now = Date.now();
  const hist = S.px[coin] || (S.px[coin] = []);
  const last = hist[hist.length - 1];
  if (!last || now - last.t > 700) hist.push({ t: now, p });
  const cut = now - LOOKBACK;
  while (hist.length > 1 && hist[0].t < cut) hist.shift();
}

function momentum() {
  let sum = 0, n = 0;
  for (const coin in S.px) {
    const hist = S.px[coin];
    if (hist.length < 2) continue;
    const then = hist[0].p, now = hist[hist.length - 1].p;
    if (!then) continue;
    sum += (now - then) / then;
    n++;
  }
  return n ? sum / n : 0;
}

const units = [];
const beams = [];
const bits = [];

function layout() {
  W = cv.clientWidth; H = cv.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;

  // Scale the army to the screen rather than letting it march off the edge.
  const narrow = W < 720;
  UNIT = narrow ? 0.72 : 1;
  SW = 11 * PX * UNIT; SH = 18 * PX * UNIT;
  RANKS = narrow ? 3 : 4;
  FILES = narrow ? 5 : 7;

  const top = narrow ? 150 : 118;
  const bot = H - (narrow ? 150 : 150);
  const usable = Math.max(120, bot - top);
  units.length = 0;
  for (const side of [0, 1]) {
    for (let r = 0; r < RANKS; r++) {
      for (let f = 0; f < FILES; f++) {
        const depth = r / Math.max(1, RANKS - 1);
        const spread = narrow ? 0.20 : 0.26;
        const homeX = side === 0
          ? W * 0.08 + depth * W * spread
          : W * 0.92 - depth * W * spread;
        const y = top + (usable * (f + 0.5)) / FILES + (r % 2 ? 11 : -11) * UNIT;
        units.push({
          side, homeX, x: homeX, y, depth, rank: r,
          alive: true, dying: 0, respawn: 0,
          bob: Math.random() * 6.283, recoil: 0,
        });
      }
    }
  }
}
window.addEventListener("resize", layout);

const money = n =>
  n >= 1e9 ? "$" + (n / 1e9).toFixed(2) + "B" :
  n >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "M" :
  n >= 1e3 ? "$" + (n / 1e3).toFixed(1) + "K" :
  "$" + n.toFixed(0);

function pick(side) {
  const pool = [];
  for (const u of units) if (u.side === side && u.alive && !u.dying) pool.push(u);
  return pool.length ? pool[(Math.random() * pool.length) | 0] : null;
}

// --- combat ---------------------------------------------------------------
function volley(attackerSide, notional) {
  const perSide = Math.max(1, units.length / 2);
  const cap = Math.max(2, Math.round(perSide / 5));   // never wipe the line
  const shots = Math.max(1, Math.min(cap, Math.round(Math.log10(1 + notional) - 1.6)));
  const heavy = notional > 120000;

  for (let i = 0; i < shots; i++) {
    const shooter = pick(attackerSide);
    const target = pick(1 - attackerSide);
    if (!shooter || !target) break;
    shooter.recoil = 1;
    beams.push({
      x1: shooter.x + (attackerSide === 0 ? SW * 0.46 : -SW * 0.46),
      y1: shooter.y - SH * 0.16,
      x2: target.x, y2: target.y - SH * 0.16,
      t: 0, speed: 0.045 + Math.random() * 0.035,
      rgb: attackerSide === 0 ? THEME.a.rgb : THEME.b.rgb,
      heavy, target,
    });
  }
  if (heavy) S.shake = Math.min(14, S.shake + 8);
}

function slay(u, rgb) {
  if (!u || !u.alive || u.dying) return;
  u.dying = 1;
  for (let i = 0; i < 14; i++) {
    bits.push({
      x: u.x, y: u.y - SH * 0.3,
      vx: (Math.random() - 0.5) * 4,
      vy: -Math.random() * 3 - 0.4,
      life: 1, rgb,
    });
  }
}

// --- frame ----------------------------------------------------------------
function frame() {
  // tanh keeps a 5% crash from pinning the field forever while still making
  // a 1% move clearly visible
  S.drift += (momentum() - S.drift) * 0.04;
  const dayShare = 0.5 + 0.5 * Math.tanh(S.day.change / DAY_SENS);
  const swing = Math.tanh(S.drift / SENS) * SWING;
  const share = Math.max(0.05, Math.min(0.95, dayShare + swing));
  S.aArmy += (FORCE * share - S.aArmy) * 0.03;
  S.bArmy += (FORCE * (1 - share) - S.bArmy) * 0.03;
  const tot = S.aArmy + S.bArmy;
  S.front += ((tot ? S.aArmy / tot : 0.5) - S.front) * 0.045;

  ctx.fillStyle = "#06080b";
  ctx.fillRect(0, 0, W, H);

  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "rgba(" + THEME.a.rgb + "," + (0.05 + S.front * 0.13).toFixed(3) + ")");
  g.addColorStop(0.5, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(" + THEME.b.rgb + "," + (0.05 + (1 - S.front) * 0.13).toFixed(3) + ")");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (S.shake > 0.3) {
    ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    S.shake *= 0.87;
  }

  const push = (S.front - 0.5) * W * 0.1;
  for (const u of units) {
    u.bob += 0.04;
    if (u.recoil > 0) u.recoil = Math.max(0, u.recoil - 0.08);

    if (u.dying) {
      u.dying -= 0.03;
      if (u.dying <= 0) {
        u.dying = 0; u.alive = false;
        // small armies must reinforce faster or the field empties out
        const rate = 28 / Math.max(1, units.length / 2);
        u.respawn = (55 + Math.random() * 80) / Math.max(1, rate);
      }
    } else if (!u.alive) {
      u.respawn -= 1;
      if (u.respawn <= 0) { u.alive = true; u.x = u.homeX - (u.side === 0 ? 80 : -80); }
    }
    u.x += ((u.homeX + push) - u.x) * 0.045;
  }

  // back ranks first so the front rank overlaps correctly
  for (let r = RANKS - 1; r >= 0; r--) {
    for (const u of units) {
      if (u.rank !== r || (!u.alive && !u.dying)) continue;
      const img = SPRITE[u.side];
      const bob = Math.sin(u.bob) * 1.6;
      const kick = u.recoil * 4 * (u.side === 0 ? -1 : 1);

      ctx.save();
      ctx.translate(u.x + kick, u.y + bob);
      ctx.globalAlpha = u.dying ? u.dying : (0.55 + (1 - u.depth) * 0.45);
      if (u.dying) ctx.rotate((u.side === 0 ? 1 : -1) * (1 - u.dying) * 1.5);
      ctx.drawImage(img, -SW / 2, -SH, SW, SH);
      ctx.restore();

      if (u.recoil > 0.5) {            // muzzle flash at the barrel
        const fx = u.x + kick + (u.side === 0 ? SW * 0.52 : -SW * 0.52);
        ctx.beginPath();
        ctx.arc(fx, u.y + bob - SH * 0.16, 4.4 * u.recoil, 0, 6.283);
        ctx.fillStyle = "rgba(255,255,255," + (u.recoil * 0.9).toFixed(2) + ")";
        ctx.fill();
      }
    }
  }

  // tracer fire
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i];
    b.t += b.speed;
    if (b.t >= 1) { slay(b.target, b.rgb); beams.splice(i, 1); continue; }
    const hx = b.x1 + (b.x2 - b.x1) * b.t, hy = b.y1 + (b.y2 - b.y1) * b.t;
    const tt = Math.max(0, b.t - 0.16);
    const tx = b.x1 + (b.x2 - b.x1) * tt, ty = b.y1 + (b.y2 - b.y1) * tt;

    ctx.strokeStyle = "rgba(" + b.rgb + ",.92)";
    ctx.lineWidth = b.heavy ? 3 : 1.6;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
    if (b.heavy) {
      ctx.beginPath(); ctx.arc(hx, hy, 3.4, 0, 6.283);
      ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.fill();
    }
  }

  for (let i = bits.length - 1; i >= 0; i--) {
    const p = bits[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.024;
    if (p.life <= 0) { bits.splice(i, 1); continue; }
    ctx.fillStyle = "rgba(" + p.rgb + "," + p.life.toFixed(3) + ")";
    ctx.fillRect(p.x, p.y, PX, PX);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}

// --- DOM ------------------------------------------------------------------
const $ = id => document.getElementById(id);
const feed = $("feed");
$("title").textContent = THEME.title;
$("aName").textContent = THEME.a.name;
$("bName").textContent = THEME.b.name;

function paintStats() {
  const cut = Date.now() - 60000;
  while (S.recent.length && S.recent[0].t < cut) S.recent.shift();

  $("nTrades").textContent = S.trades.toLocaleString();
  $("vol").textContent = money(S.vol);
  $("aKills").textContent = money(S.buyVol);
  $("bKills").textContent = money(S.sellVol);

  const b = S.btc;
  if (b.px) {
    $("btcPx").textContent = "$" + b.px.toLocaleString(undefined,
      { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    const ref = S.day.open || b.open;
    if (ref) {
      const pc = ((b.px - ref) / ref) * 100;
      const el = $("btcChg");
      el.textContent = (pc >= 0 ? "+" : "") + pc.toFixed(2) + "%";
      el.style.color = pc >= 0 ? "var(--a)" : "var(--b)";
    }
  }
  drawSpark();
  if (S.biggest) $("biggest").textContent = money(S.biggest) + " " + S.biggestCoin;
  const d = S.drift * 100;
  const dEl = $("drift");
  dEl.textContent = (d >= 0 ? "+" : "") + d.toFixed(2) + "%";
  dEl.style.color = d >= 0 ? "var(--a)" : "var(--b)";
  $("aArmy").textContent = Math.round(S.aArmy).toLocaleString();
  $("bArmy").textContent = Math.round(S.bArmy).toLocaleString();
  const tot = S.aArmy + S.bArmy;
  $("bar").style.width = ((tot ? S.aArmy / tot : 0.5) * 100).toFixed(1) + "%";
}

// Price and cumulative volume delta on shared time, separately scaled. They
// are different units, so what matters is the SHAPE: when price climbs while
// CVD falls, buyers are being absorbed and the move is not supported.
const spark = document.getElementById("spark");
const sctx = spark.getContext("2d");

function drawSpark() {
  const w = spark.width, h = spark.height, pad = 4;
  sctx.clearRect(0, 0, w, h);

  const hist = S.day.series, live = S.btc.series;
  const price = hist.concat(live);
  if (price.length < 2) {
    sctx.fillStyle = "rgba(124,135,152,.7)";
    sctx.font = "20px ui-sans-serif, system-ui, sans-serif";
    sctx.textAlign = "center";
    sctx.fillText("collecting…", w / 2, h / 2 + 7);
    return;
  }

  // One time axis for both series. CVD only exists from page load, so it
  // draws over the right-hand slice — which is honest: we cannot know the
  // day's order flow from candles, only its prices.
  const t0 = price[0].t, t1 = Math.max(price[price.length - 1].t, Date.now());
  const span = Math.max(1, t1 - t0);
  const X = t => pad + ((t - t0) / span) * (w - pad * 2);

  // A floor on the range matters: auto-scaling a $5 move on a $63,000 price
  // fills the chart height and makes a flat market look violent.
  const plot = (pts, get, colour, width, minSpan) => {
    if (pts.length < 2) return;
    let lo = Infinity, hi = -Infinity;
    for (const q of pts) { const v = get(q); if (v < lo) lo = v; if (v > hi) hi = v; }
    let range = hi - lo;
    const floor = minSpan || 0;
    if (range < floor) { const mid = (hi + lo) / 2; lo = mid - floor / 2; hi = mid + floor / 2; range = floor; }
    if (!range) range = 1;
    sctx.beginPath();
    pts.forEach((q, i) => {
      const x = X(q.t);
      const y = h - pad - ((get(q) - lo) / range) * (h - pad * 2);
      i ? sctx.lineTo(x, y) : sctx.moveTo(x, y);
    });
    sctx.strokeStyle = colour;
    sctx.lineWidth = width;
    sctx.lineJoin = "round";
    sctx.stroke();
  };

  // Shade the region we have order flow for. Freshly loaded this is a sliver
  // and grows as the page runs — shading it says "live data starts here"
  // rather than leaving a stray purple mark that looks like a glitch.
  if (hist.length && live.length) {
    const x = X(live[0].t);
    sctx.fillStyle = "rgba(139,124,246,.09)";
    sctx.fillRect(x, pad, w - pad - x, h - pad * 2);
    sctx.strokeStyle = "rgba(232,236,241,.16)";
    sctx.lineWidth = 2;
    sctx.setLineDash([3, 4]);
    sctx.beginPath(); sctx.moveTo(x, pad); sctx.lineTo(x, h - pad); sctx.stroke();
    sctx.setLineDash([]);
  }

  plot(live, q => q.c, "#8b7cf6", 3, Math.max(1, (S.buyVol + S.sellVol) * 0.05));
  plot(price, q => q.p, "#e8ecf1", 3, price[price.length - 1].p * 0.004);
}

function pushKill(aSide, coin, notional) {
  const el = document.createElement("div");
  el.className = "kill " + (aSide ? "a" : "b") + (notional > 250000 ? " big" : "");
  el.innerHTML = '<span class="coin">' + coin + "</span>" +
    '<span class="amt">' + money(notional) + " " +
    (aSide ? "buy" : "sell") + "</span>";
  feed.appendChild(el);
  while (feed.children.length > 4) feed.removeChild(feed.firstChild);
}

// One normalised entry point, whichever exchange the trade came from.
function onTrade(aSide, coin, notional, price) {
  if (!isFinite(notional) || notional <= 0) return;
  recordPrice(coin, price);
  const hint = $("hint"); if (hint) hint.remove();

  S.trades++; S.vol += notional;
  if (notional > S.biggest) { S.biggest = notional; S.biggestCoin = coin; }
  if (aSide) S.buyVol += notional; else S.sellVol += notional;

  if (coin === "BTC" && isFinite(price) && price > 0) {
    const b = S.btc;
    b.px = price;
    if (b.open === null) b.open = price;
    b.cvd += aSide ? notional : -notional;
    if (S.day.open) S.day.change = (price - S.day.open) / S.day.open;
    const now = Date.now();
    if (now - b.lastSample > 2000) {
      b.lastSample = now;
      b.series.push({ t: now, p: price, c: b.cvd });
      if (b.series.length > 900) b.series.shift();
    }
  }

  volley(aSide ? 0 : 1, notional);
  if (notional > 15000) pushKill(aSide, coin, notional);
}

// --- feeds ----------------------------------------------------------------
const live = { hl: false, cb: false };
function paintStatus() {
  const on = [live.cb && "coinbase", live.hl && "hyperliquid"].filter(Boolean);
  $("stat").textContent = on.length ? "live · " + on.join(" + ") : "connecting…";
  $("dot").className = "dot " + (on.length ? "live" : "dead");
}

function connectHyperliquid() {
  const coins = ["BTC", "ETH", "SOL", "HYPE", "DOGE", "XRP"];
  const ws = new WebSocket("wss://api.hyperliquid.xyz/ws");
  ws.onopen = () => {
    live.hl = true; paintStatus();
    for (const c of coins) {
      ws.send(JSON.stringify({ method: "subscribe", subscription: { type: "trades", coin: c } }));
    }
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.channel !== "trades" || !Array.isArray(m.data)) return;
    for (const t of m.data) {
      // "B" = a buyer lifted the offer, so the aggressor is bullish
      onTrade(t.side === "B", t.coin, parseFloat(t.px) * parseFloat(t.sz), parseFloat(t.px));
    }
    paintStats();
  };
  ws.onclose = () => { live.hl = false; paintStatus(); setTimeout(connectHyperliquid, 2500); };
  ws.onerror = () => ws.close();
}

function connectCoinbase() {
  const pairs = ["BTC-USD", "ETH-USD", "SOL-USD", "DOGE-USD", "XRP-USD", "LTC-USD", "ADA-USD"];
  const ws = new WebSocket("wss://ws-feed.exchange.coinbase.com");
  ws.onopen = () => {
    live.cb = true; paintStatus();
    ws.send(JSON.stringify({ type: "subscribe", product_ids: pairs, channels: ["matches"] }));
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type !== "match" && m.type !== "last_match") return;
    // Coinbase reports the MAKER's side, so the aggressor is the opposite:
    // maker "sell" means the taker bought — a bullish aggressor.
    const aSide = m.side === "sell";
    onTrade(aSide, (m.product_id || "").split("-")[0],
            parseFloat(m.price) * parseFloat(m.size), parseFloat(m.price));
    paintStats();
  };
  ws.onclose = () => { live.cb = false; paintStatus(); setTimeout(connectCoinbase, 2500); };
  ws.onerror = () => ws.close();
}

layout();
loadDay();
requestAnimationFrame(frame);
connectCoinbase();
connectHyperliquid();
</script>
