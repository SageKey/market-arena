<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bulls vs Bears — live perp tape</title>
<style>
  :root {
    --a: #22e5a0;
    --b: #ff4d6a;
    --ink: #e8ecf1;
    --dim: #7c8798;
    --bg: #06080b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .layer { position: fixed; inset: 0; pointer-events: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: baseline; gap: 14px; padding: 18px 22px;
  }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .status { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .dot.live { background: var(--a); box-shadow: 0 0 8px var(--a); }
  .dot.dead { background: var(--b); }

  .meter-wrap { position: fixed; top: 54px; left: 22px; right: 22px; }
  .meter { height: 3px; border-radius: 2px; background: var(--b); overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--a); width: 50%; transition: width .4s cubic-bezier(.4,0,.2,1); }
  .meter-labels { display: flex; justify-content: space-between; margin-top: 7px; font-size: 12px; font-weight: 500; }
  .a-t { color: var(--a); } .b-t { color: var(--b); }
  .num { font-variant-numeric: tabular-nums; }

  .board {
    position: fixed; left: 22px; bottom: 22px; font-size: 12px; color: var(--dim);
    display: grid; grid-template-columns: auto auto; gap: 3px 16px;
  }
  .board b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .dimspan { opacity: .5; }

  .feed {
    position: fixed; right: 22px; bottom: 22px; width: 280px;
    display: flex; flex-direction: column-reverse; gap: 4px;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .kill {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 5px 9px; border-radius: 5px;
    background: rgba(255,255,255,.05); border-left: 2px solid var(--dim);
    animation: slide .28s cubic-bezier(.2,0,0,1);
  }
  .kill.a { border-left-color: var(--a); }
  .kill.b { border-left-color: var(--b); }
  .kill .coin { color: var(--ink); font-weight: 500; }
  .kill .amt { color: var(--dim); white-space: nowrap; }
  .kill.big { background: rgba(255,255,255,.1); }
  .kill.big .amt { color: var(--ink); }
  @keyframes slide { from { opacity: 0; transform: translateX(14px); } }

  .hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="layer">
  <header>
    <h1 id="title">Bulls vs Bears</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="stat">connecting…</span></span>
  </header>

  <div class="meter-wrap">
    <div class="meter"><i id="bar"></i></div>
    <div class="meter-labels">
      <span class="a-t"><span id="aName">BULLS</span> <span class="num" id="aArmy">10,000</span></span>
      <span class="b-t"><span class="num" id="bArmy">10,000</span> <span id="bName">BEARS</span></span>
    </div>
  </div>

  <div class="board">
    <span>trades</span><b id="nTrades">0</b>
    <span>volume</span><b id="vol">$0</b>
    <span><span id="aKillLbl">bull</span> kills <span class="dimspan">60s</span></span><b id="aKills">0</b>
    <span><span id="bKillLbl">bear</span> kills <span class="dimspan">60s</span></span><b id="bKills">0</b>
    <span>biggest hit</span><b id="biggest">—</b>
  </div>

  <div class="feed" id="feed"></div>
  <div class="hint" id="hint">waiting for the tape…</div>
</div>

<script>
// ---------------------------------------------------------------------------
// Two armies fight on live exchange data.
//
// Hyperliquid's trade feed names an aggressor on every print: side "B" means a
// buyer lifted the offer, side "A" means a seller hit the bid. Each trade sends
// that faction's soldiers firing across the field, and the notional decides how
// many of them shoot. The browser talks to the exchange directly — no server,
// no API key, no dependencies.
// ---------------------------------------------------------------------------

const COINS = ["BTC", "ETH", "SOL", "HYPE", "DOGE", "XRP"];
const WS_URL = "wss://api.hyperliquid.xyz/ws";

// --- themes ---------------------------------------------------------------
// The engine only knows "side A" and "side B". Everything nameable lives here,
// so a new faction is a data change, not a code change. Reload with ?theme=<key>.
// `figure` picks the silhouette: ears | cape | horns | round.

const THEMES = {
  market: {
    title: "Bulls vs Bears",
    a: { name: "BULLS", unit: "bulls", rgb: "34,229,160", figure: "horns" },
    b: { name: "BEARS", unit: "bears", rgb: "255,77,106", figure: "round" },
  },
  gothic: {
    title: "Werewolves vs Vampires",
    a: { name: "WEREWOLVES", unit: "wolves", rgb: "168,222,88", figure: "ears" },
    b: { name: "VAMPIRES", unit: "vampires", rgb: "226,42,96", figure: "cape" },
  },
  frost: {
    title: "Frost vs Ember",
    a: { name: "FROST", unit: "frost", rgb: "96,196,255", figure: "round" },
    b: { name: "EMBER", unit: "ember", rgb: "255,142,48", figure: "horns" },
  },
};

const THEME = THEMES[new URLSearchParams(location.search).get("theme")] || THEMES.market;
document.title = THEME.title + " — live perp tape";
document.documentElement.style.setProperty("--a", "rgb(" + THEME.a.rgb + ")");
document.documentElement.style.setProperty("--b", "rgb(" + THEME.b.rgb + ")");

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W = 0, H = 0;

// --- armies ---------------------------------------------------------------
// The counters are the "real" army size; the sprites on screen are a company
// standing in for the whole force. Sprites die on every trade so the field
// stays busy, and reinforcements march up from the rear to replace them.

const BASE = 10000;
const RECRUIT = 0.012;
const KILL_PER_DOLLAR = 1 / 900;
const RANKS = 5, FILES = 9;          // 45 sprites per side

const S = {
  trades: 0, vol: 0, aArmy: BASE, bArmy: BASE,
  biggest: 0, biggestCoin: "", front: 0.5, shake: 0,
  recent: [],
};

const units = [];
const beams = [];
const bits = [];

function layout() {
  W = cv.clientWidth; H = cv.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const top = 112, bot = H - 100;
  const usable = Math.max(120, bot - top);
  units.length = 0;
  for (const side of [0, 1]) {
    for (let r = 0; r < RANKS; r++) {
      for (let f = 0; f < FILES; f++) {
        const depth = r / Math.max(1, RANKS - 1);        // 0 = front rank
        const homeX = side === 0
          ? W * 0.07 + depth * W * 0.27
          : W * 0.93 - depth * W * 0.27;
        const y = top + (usable * (f + 0.5)) / FILES + (r % 2 ? 8 : -8);
        units.push({
          side, homeX, x: homeX, y, depth,
          alive: true, dying: 0, respawn: 0,
          bob: Math.random() * 6.283, recoil: 0,
        });
      }
    }
  }
}
window.addEventListener("resize", layout);

const money = n =>
  n >= 1e9 ? "$" + (n / 1e9).toFixed(2) + "B" :
  n >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "M" :
  n >= 1e3 ? "$" + (n / 1e3).toFixed(1) + "K" :
  "$" + n.toFixed(0);

function pick(side) {
  const pool = [];
  for (const u of units) if (u.side === side && u.alive && !u.dying) pool.push(u);
  return pool.length ? pool[(Math.random() * pool.length) | 0] : null;
}

// --- combat ---------------------------------------------------------------
function volley(attackerSide, notional) {
  // A bigger print puts more soldiers on the trigger.
  const shots = Math.max(1, Math.min(7, Math.round(Math.log10(1 + notional) - 1.4)));
  const heavy = notional > 120000;

  for (let i = 0; i < shots; i++) {
    const shooter = pick(attackerSide);
    const target = pick(1 - attackerSide);
    if (!shooter || !target) break;

    shooter.recoil = 1;
    beams.push({
      x1: shooter.x + (attackerSide === 0 ? 12 : -12),
      y1: shooter.y - 7,
      x2: target.x, y2: target.y - 7,
      t: 0,
      speed: 0.05 + Math.random() * 0.035,
      rgb: attackerSide === 0 ? THEME.a.rgb : THEME.b.rgb,
      heavy, target,
    });
  }
  if (heavy) S.shake = Math.min(15, S.shake + 9);
}

function slay(u, rgb) {
  if (!u || !u.alive || u.dying) return;
  u.dying = 1;
  for (let i = 0; i < 12; i++) {
    bits.push({
      x: u.x, y: u.y - 6,
      vx: (Math.random() - 0.5) * 3.6,
      vy: -Math.random() * 2.8 - 0.4,
      life: 1, rgb,
    });
  }
}

// --- sprite ---------------------------------------------------------------
function drawFigure(u, cfg, alpha) {
  const face = u.side === 0 ? 1 : -1;
  const bob = Math.sin(u.bob) * 1.3;
  const rgb = cfg.rgb;

  ctx.save();
  ctx.translate(u.x, u.y + bob);
  if (u.dying) {
    ctx.rotate(face * (1 - u.dying) * 1.5);   // topple away from the shot
    ctx.globalAlpha = u.dying * alpha;
  } else {
    ctx.globalAlpha = alpha;
  }

  const body = "rgba(" + rgb + ",1)";

  // legs
  ctx.strokeStyle = body; ctx.lineWidth = 1.6; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-2, 0); ctx.lineTo(-3.4, 5);
  ctx.moveTo(2, 0); ctx.lineTo(3.4, 5);
  ctx.stroke();

  // cape (vampires) sits behind the torso
  if (cfg.figure === "cape") {
    ctx.beginPath();
    ctx.moveTo(-face * 1, -12);
    ctx.lineTo(-face * 9, 3);
    ctx.lineTo(-face * 1, 1);
    ctx.closePath();
    ctx.fillStyle = "rgba(" + rgb + ",.4)";
    ctx.fill();
  }

  // torso
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.roundRect(-3, -12, 6, 12, 2.4);
  ctx.fill();

  // head
  ctx.beginPath();
  ctx.arc(face * 0.6, -15.2, 3.6, 0, 6.283);
  ctx.fill();

  // silhouette tell
  if (cfg.figure === "ears") {
    ctx.beginPath();
    ctx.moveTo(-1.8, -17.6); ctx.lineTo(-3.4, -21.6); ctx.lineTo(0.4, -18.6);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(2.8, -17.4); ctx.lineTo(3.9, -21.5); ctx.lineTo(4.9, -17.5);
    ctx.closePath(); ctx.fill();
  } else if (cfg.figure === "horns") {
    ctx.strokeStyle = body; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-2.5, -17.4); ctx.quadraticCurveTo(-6.4, -19.4, -5.2, -22.2);
    ctx.moveTo(3.6, -17.4); ctx.quadraticCurveTo(7.5, -19.4, 6.3, -22.2);
    ctx.stroke();
  }

  // weapon — kicks back when it fires
  const kick = u.recoil * 3.4;
  ctx.strokeStyle = "rgba(" + rgb + ",.95)";
  ctx.lineWidth = 2.1;
  ctx.beginPath();
  ctx.moveTo(face * (3 - kick), -7.2);
  ctx.lineTo(face * (13 - kick), -8.2);
  ctx.stroke();

  if (u.recoil > 0.5) {                       // muzzle flash
    ctx.beginPath();
    ctx.arc(face * (14.4 - kick), -8.3, 3.1 * u.recoil, 0, 6.283);
    ctx.fillStyle = "rgba(255,255,255," + (u.recoil * 0.85).toFixed(2) + ")";
    ctx.fill();
  }
  ctx.restore();
}

// --- frame ----------------------------------------------------------------
function frame() {
  // both sides recruit back toward baseline, so the war never actually ends
  S.aArmy += (BASE - S.aArmy) * RECRUIT;
  S.bArmy += (BASE - S.bArmy) * RECRUIT;
  const tot = S.aArmy + S.bArmy;
  S.front += ((tot ? S.aArmy / tot : 0.5) - S.front) * 0.045;

  ctx.fillStyle = "#06080b";
  ctx.fillRect(0, 0, W, H);

  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "rgba(" + THEME.a.rgb + "," + (0.05 + S.front * 0.13).toFixed(3) + ")");
  g.addColorStop(0.5, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(" + THEME.b.rgb + "," + (0.05 + (1 - S.front) * 0.13).toFixed(3) + ")");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (S.shake > 0.3) {
    ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    S.shake *= 0.87;
  }

  ctx.strokeStyle = "rgba(232,236,241,.06)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H - 82); ctx.lineTo(W, H - 82); ctx.stroke();

  // the winning side pushes the whole formation forward
  const push = (S.front - 0.5) * W * 0.11;
  for (const u of units) {
    u.bob += 0.045;
    if (u.recoil > 0) u.recoil = Math.max(0, u.recoil - 0.085);

    if (u.dying) {
      u.dying -= 0.032;
      if (u.dying <= 0) { u.dying = 0; u.alive = false; u.respawn = 70 + Math.random() * 90; }
    } else if (!u.alive) {
      u.respawn -= 1;
      if (u.respawn <= 0) {                    // reinforcement marches up
        u.alive = true;
        u.x = u.homeX - (u.side === 0 ? 70 : -70);
      }
    }
    u.x += ((u.homeX + push) - u.x) * 0.045;
  }

  // back ranks first so the front rank reads on top
  for (let r = RANKS - 1; r >= 0; r--) {
    for (const u of units) {
      if (Math.round(u.depth * (RANKS - 1)) !== r) continue;
      if (!u.alive && !u.dying) continue;
      drawFigure(u, u.side === 0 ? THEME.a : THEME.b, 0.5 + (1 - u.depth) * 0.5);
    }
  }

  // tracer fire
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i];
    b.t += b.speed;
    if (b.t >= 1) { slay(b.target, b.rgb); beams.splice(i, 1); continue; }

    const hx = b.x1 + (b.x2 - b.x1) * b.t;
    const hy = b.y1 + (b.y2 - b.y1) * b.t;
    const tailT = Math.max(0, b.t - 0.15);
    const tx = b.x1 + (b.x2 - b.x1) * tailT;
    const ty = b.y1 + (b.y2 - b.y1) * tailT;

    ctx.strokeStyle = "rgba(" + b.rgb + ",.92)";
    ctx.lineWidth = b.heavy ? 2.8 : 1.5;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();

    if (b.heavy) {
      ctx.beginPath(); ctx.arc(hx, hy, 3.2, 0, 6.283);
      ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.fill();
    }
  }

  // debris
  for (let i = bits.length - 1; i >= 0; i--) {
    const p = bits[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.life -= 0.025;
    if (p.life <= 0) { bits.splice(i, 1); continue; }
    ctx.fillStyle = "rgba(" + p.rgb + "," + p.life.toFixed(3) + ")";
    ctx.fillRect(p.x, p.y, 2, 2);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}

// --- DOM ------------------------------------------------------------------
const $ = id => document.getElementById(id);
const feed = $("feed");
$("title").textContent = THEME.title;
$("aName").textContent = THEME.a.name;
$("bName").textContent = THEME.b.name;
$("aKillLbl").textContent = THEME.a.unit;
$("bKillLbl").textContent = THEME.b.unit;

function trimWindow(now) {
  const cut = now - 60000;
  while (S.recent.length && S.recent[0].t < cut) S.recent.shift();
}

function paintStats() {
  trimWindow(Date.now());
  let aK = 0, bK = 0;
  for (const r of S.recent) { if (r.aSide) aK += r.kills; else bK += r.kills; }

  $("nTrades").textContent = S.trades.toLocaleString();
  $("vol").textContent = money(S.vol);
  $("aKills").textContent = Math.round(aK).toLocaleString();
  $("bKills").textContent = Math.round(bK).toLocaleString();
  if (S.biggest) $("biggest").textContent = money(S.biggest) + " " + S.biggestCoin;
  $("aArmy").textContent = Math.round(S.aArmy).toLocaleString();
  $("bArmy").textContent = Math.round(S.bArmy).toLocaleString();
  const tot = S.aArmy + S.bArmy;
  $("bar").style.width = ((tot ? S.aArmy / tot : 0.5) * 100).toFixed(1) + "%";
}

function pushKill(aSide, coin, notional, kills) {
  const el = document.createElement("div");
  el.className = "kill " + (aSide ? "a" : "b") + (notional > 250000 ? " big" : "");
  el.innerHTML = '<span class="coin">' + coin + "</span>" +
    '<span class="amt">' + money(notional) + " · " + Math.round(kills).toLocaleString() +
    " " + (aSide ? THEME.b.unit : THEME.a.unit) + " down</span>";
  feed.appendChild(el);
  while (feed.children.length > 12) feed.removeChild(feed.firstChild);
}

// --- tape -----------------------------------------------------------------
let ws, retry = 0;

function connect() {
  $("stat").textContent = "connecting…";
  $("dot").className = "dot";
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    retry = 0;
    $("stat").textContent = "live · hyperliquid";
    $("dot").className = "dot live";
    for (const coin of COINS) {
      ws.send(JSON.stringify({ method: "subscribe", subscription: { type: "trades", coin } }));
    }
  };

  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.channel !== "trades" || !Array.isArray(msg.data)) return;
    const hint = $("hint"); if (hint) hint.remove();

    for (const t of msg.data) {
      const aSide = t.side === "B";               // buyer was the aggressor
      const notional = parseFloat(t.px) * parseFloat(t.sz);
      if (!isFinite(notional)) continue;

      S.trades++; S.vol += notional;
      if (notional > S.biggest) { S.biggest = notional; S.biggestCoin = t.coin; }

      const kills = Math.max(1, notional * KILL_PER_DOLLAR);
      if (aSide) S.bArmy = Math.max(0, S.bArmy - kills);
      else       S.aArmy = Math.max(0, S.aArmy - kills);
      S.recent.push({ t: Date.now(), aSide, kills });

      volley(aSide ? 0 : 1, notional);
      if (notional > 15000) pushKill(aSide, t.coin, notional, kills);
    }
    paintStats();
  };

  ws.onclose = () => {
    $("stat").textContent = "reconnecting…";
    $("dot").className = "dot dead";
    retry = Math.min(retry + 1, 6);
    setTimeout(connect, 400 * Math.pow(2, retry));
  };
  ws.onerror = () => ws.close();
}

layout();
requestAnimationFrame(frame);
connect();
</script>
</body>
</html>
